; The very slick RAK wireless RAK 4631 / 4630 board - Unified firmware for 5005/19003, with or without OLED RAK 1921
;
; MEMORY OPTIMIZATION BUILD CONFIGURATION:
; This is an aggressively optimized build configuration designed for memory-constrained environments.
; It excludes many modules and features to minimize RAM and Flash usage, enabling stable long-duration
; operation with frequent message sending (e.g., 15-second intervals for 10+ hours).
;
; Key optimizations applied:
; - Excludes GPS, display, sensor, and networking modules
; - Disables audio/buzzer feedback and visual indicators
; - Removes unused radio chip drivers and protocols
; - Excludes development/debugging features
; - Applies aggressive compiler optimizations
;
; Total memory savings: ~10-15KB Flash, ~200-500 bytes RAM
; Final usage: RAM 11.6% (28.9KB), Flash 37.3% (304KB)
;
; IMPORTANT: Some functionality is permanently removed in this build.
; See individual flag comments below for details on what each exclusion removes.
;
[env:rak4631_lite]
extends = nrf52840_base
board = wiscore_rak4631
board_check = true
extra_scripts =
  ${env.extra_scripts}
  variants/rak4631_lite/scripts/features.py
; Feature toggles (handled by variants/rak4631_lite/scripts/features.py)
; Set to true to enable. Dependencies are resolved automatically (e.g. monitoring pulls in range_test).
custom_feature_admin_module = true       ; keep remote admin (PIN) commands for on-device configuration
custom_feature_node_info = true          ; broadcast node cards for phone apps
custom_feature_neighbor_info = true      ; maintain neighbor table for smarter routing metrics
custom_feature_device_telemetry = true   ; periodic device stats (uptime, temp, voltage)
custom_feature_power_telemetry = true    ; INA/MAX1704x power metrics support
custom_feature_rgb_led = true             ; MINIMAL TEST: enable RGB (no external file changes)
custom_feature_range_test = false         ; Re-enable RangeTest module (required for monitoring commands)
custom_feature_monitoring = false         ; DeviceStats module with dynamic node scaling
custom_feature_store_forward = false      ; Store & forward mesh relay
custom_feature_remote_hardware = false    ; Remote GPIO control module
custom_feature_canned_messages = false    ; Predefined canned message module
custom_feature_reply_module = false       ; Legacy auto-reply module
custom_feature_radiolib_ax25 = false      ; AX.25 framing support
custom_feature_radiolib_afsk = false      ; AFSK modem support (needed for APRS)
custom_feature_radiolib_aprs = false      ; APRS helpers (requires AX.25 + AFSK)
custom_feature_radiolib_bell = false      ; Bell modem emulation
custom_feature_radiolib_morse = false     ; Morse encoder/decoder
custom_feature_radiolib_rtty = false      ; RTTY modem
custom_feature_radiolib_sstv = false      ; Slow-scan TV encoder
build_flags =
  ${nrf52840_base.build_flags}
  -Ivariants/rak4631_lite
  -DRAK_4631
  -DHAS_ETHERNET=0
  ; Disable all compiler warnings
  -w
  ; GPS exclusion - removes automatic position tracking and GPS-based features
  ; Functionality lost: automatic location sharing, GPS coordinates in messages, position-based routing
  -DMESHTASTIC_EXCLUDE_GPS=1
  ; -DGPS_POWER_TOGGLE ; comment this line to disable triple press function on the user button to turn off gps entirely.
  -DHW_VERSION=HW_VERSION_UNSET
  ; Display hardware exclusions - removes all visual output capabilities
  ; Functionality lost: status display, message preview, settings UI, signal strength indicators
  -DHAS_SCREEN=0
  ; E-Ink display exclusion - removes low-power display support
  ; Functionality lost: persistent status display, battery-efficient visual feedback
  -DHAS_EINK=0
  ; RadioLib exclusions - remove unused radio chip drivers
  -DRADIOLIB_EXCLUDE_SX128X=1    ; Exclude SX128x 2.4GHz LoRa chips
  -DRADIOLIB_EXCLUDE_SX127X=1    ; Exclude SX127x 915/868MHz LoRa chips (not used in RAK4631)
  -DRADIOLIB_EXCLUDE_LR11X0=1    ; Exclude LR11x0 LoRa chips
  -DRADIOLIB_EXCLUDE_RF69=1      ; Exclude RF69 FSK radio chips
  -DRADIOLIB_EXCLUDE_SX123X=1    ; Exclude SX123x FSK radio chips
  -DRADIOLIB_EXCLUDE_SI443X=1    ; Exclude Si443x radio chips
  -DRADIOLIB_EXCLUDE_NRF24=1     ; Exclude nRF24 2.4GHz radio chips
  -DRADIOLIB_EXCLUDE_CC1101=1    ; Exclude CC1101 sub-GHz radio chips
  ; RadioLib protocol exclusions - remove unused communication protocols
  -DRADIOLIB_EXCLUDE_AFSK=1      ; Exclude AFSK (Audio Frequency Shift Keying)
  -DRADIOLIB_EXCLUDE_APRS=1      ; Exclude APRS (Automatic Packet Reporting System)
  -DRADIOLIB_EXCLUDE_AX25=1      ; Exclude AX.25 packet radio protocol
  -DRADIOLIB_EXCLUDE_BELL=1      ; Exclude Bell modem protocol
  -DRADIOLIB_EXCLUDE_HELLSCHREIBER=1 ; Exclude Hellschreiber text transmission
  -DRADIOLIB_EXCLUDE_LORAWAN=1   ; Exclude LoRaWAN protocol (not used in mesh)
  -DRADIOLIB_EXCLUDE_MORSE=1     ; Exclude Morse code transmission
  -DRADIOLIB_EXCLUDE_RTTY=1      ; Exclude RTTY (Radio Teletype)
  -DRADIOLIB_EXCLUDE_SSTV=1      ; Exclude SSTV (Slow Scan Television)
  ; Core functionality exclusions for minimal build
  ; Functionality lost: WiFi networking, web interface, WiFi mesh, internet connectivity, over-the-air updates
  -DMESHTASTIC_EXCLUDE_WIFI=1
  ; Functionality lost: visual status updates, menu navigation, message display, settings interface
  -DMESHTASTIC_EXCLUDE_SCREEN=1
  ; Functionality lost: sensor communication, external device control, I2C peripheral support
  -DMESHTASTIC_EXCLUDE_I2C=1
  ; Functionality lost: temperature, humidity, pressure readings from built-in sensors
  -DMESHTASTIC_EXCLUDE_ENVIRONMENTAL_SENSOR=1
  ; Functionality lost: support for additional weather sensors, external environmental monitoring
  -DMESHTASTIC_EXCLUDE_ENVIRONMENTAL_SENSOR_EXTERNAL=1
  ; Functionality lost: movement alerts, presence detection, motion-triggered events
  -DMESHTASTIC_EXCLUDE_DETECTIONSENSOR=1
  ; Keep power FSM - critical for device power management and sleep states
  ; -DMESHTASTIC_EXCLUDE_POWER_FSM=1
  ; Keep power telemetry - essential for battery monitoring, voltage readings, power consumption tracking
  -DMESHTASTIC_EXCLUDE_POWER_TELEMETRY=0
  ; Functionality lost: automatic time zone adjustment, daylight saving time handling
  -DMESHTASTIC_EXCLUDE_TZ=1
  ; Functionality lost: LED indicators, buzzer control, button feedback, visual/audio notifications
  -DMESHTASTIC_EXCLUDE_EXTERNALNOTIFICATION=1
  ; Functionality lost: MQTT broker connectivity, IoT integration, cloud messaging
  -DMESHTASTIC_EXCLUDE_MQTT=1
  ; Functionality lost: HTTP web interface, configuration portal, file serving
  -DMESHTASTIC_EXCLUDE_WEBSERVER=1
  ; Functionality lost: input event routing, button mapping, touch screen support
  -DMESHTASTIC_EXCLUDE_INPUTBROKER=1
  ; Meshtastic module exclusions - remove unused application modules
  ; Functionality lost: anonymous people counting, crowd density monitoring, foot traffic analysis
  -DMESHTASTIC_EXCLUDE_PAXCOUNTER=1
  ; Functionality lost: GPIO control over mesh, remote sensor reading, hardware automation
  -DMESHTASTIC_EXCLUDE_REMOTEHARDWARE=1
  ; Functionality lost: message relay for offline nodes, automatic message forwarding, mesh bridging
  -DMESHTASTIC_EXCLUDE_STOREFORWARD=1
  ; Functionality lost: quick reply messages, emergency texts, predefined status updates
  -DMESHTASTIC_EXCLUDE_CANNEDMESSAGES=1
  ; Functionality lost: GPS coordinate sharing, point-of-interest marking, location broadcasting
  -DMESHTASTIC_EXCLUDE_WAYPOINT=1
  ; Functionality lost: signal strength testing, mesh range validation, link quality analysis
  -DMESHTASTIC_EXCLUDE_RANGETEST=1
  ; Functionality lost: network path discovery, hop counting, routing diagnostics
  ; -DMESHTASTIC_EXCLUDE_TRACEROUTE=1
  ; Functionality lost: orientation sensing, fall detection, device positioning
  -DMESHTASTIC_EXCLUDE_ACCELEROMETER=1
  ; Functionality lost: automatic wake on movement, motion-based alerts, activity detection
  -DMESHTASTIC_EXCLUDE_MOTION_DETECTION=1
  ; TinyUSB exclusions - keep DFU for firmware updates, disable unused USB classes
  ; Functionality lost: USB audio playback/recording, sound card emulation
  -DCFG_TUD_AUDIO=0
  ; Functionality lost: keyboard/mouse emulation, joystick control, custom HID devices
  -DCFG_TUD_HID=0
  ; Functionality lost: MIDI instrument control, music device connectivity
  -DCFG_TUD_MIDI=0
  ; Functionality lost: USB flash drive mode, file system access over USB
  -DCFG_TUD_MSC=0
  ; Functionality lost: webcam functionality, video streaming over USB
  -DCFG_TUD_VIDEO=0
  ; Functionality lost: USB network adapter mode, ethernet over USB connectivity
  -DCFG_TUD_ECM_RNDIS=0
  ; Functionality lost: browser-based device control, web USB API access
  -DCFG_TUD_WEBUSB=0
  ; Functionality lost: USB Bluetooth adapter mode, HCI interface
  -DCFG_TUD_BTH=0
  ; Functionality lost: test equipment interface, measurement device protocols
  -DCFG_TUD_USBTMC=0
  ; Functionality lost: custom USB protocols, manufacturer-specific interfaces
  -DCFG_TUD_VENDOR=0
  ; TinyUSB Host exclusions - let library determine default values
  ; -DCFG_TUH_ENABLED=0           ; USB host mode not needed for this device
  ; -DCFG_TUH_HID=0               ; USB host HID class not needed
  ; -DCFG_TUH_MSC=0               ; USB host mass storage not needed
  ; -DCFG_TUH_CDC=0               ; USB host serial communication not needed
  ; Additional RadioLib exclusions - remove more unused radio interfaces and protocols
  -DRADIOLIB_EXCLUDE_STM32WLX=1         ; Exclude STM32WL wireless SoC support
  ; -DRADIOLIB_EXCLUDE_DIRECT_RECEIVE=1  ; Keep direct receive for ACK handling
  -DRADIOLIB_EXCLUDE_PAGER=1            ; Exclude pager protocol support
  -DRADIOLIB_EXCLUDE_FSK4=1             ; Exclude FSK4 modulation
  -DRADIOLIB_EXCLUDE_EXTERNAL_RADIO=1   ; Exclude external radio interface
  ; Additional RadioLib exclusions specific to RAK4631
  -DRADIOLIB_EXCLUDE_RFM2X=1            ; Exclude RFM2x radio modules
  -DRADIOLIB_EXCLUDE_LLCC68=1           ; Exclude LLCC68 LoRa chip
  ; Additional exclusions for memory savings
  ; Functionality lost: audio alerts, buzzer notifications, sound feedback, ringtones
  ; -DMESHTASTIC_EXCLUDE_AUDIO=1        ; MINIMAL TEST: disabled (requires external file changes)
  ; Functionality lost: military tactical integration, ATAK map sharing, tactical awareness
  -DMESHTASTIC_EXCLUDE_ATAK=1
  ; Functionality lost: Bluetooth connection logging, BLE debug information, pairing history
  -DMESHTASTIC_EXCLUDE_BLUETOOTH_LOG=1
  ; Functionality lost: JSON API support, structured data export, web service integration
  -DMESHTASTIC_EXCLUDE_JSON=1
  ; Functionality lost: serial console interface, UART communication, CLI access
  -DMESHTASTIC_EXCLUDE_SERIAL=1
  ; Functionality lost: file dropping capabilities, bulk data transfer, content sharing
  -DMESHTASTIC_EXCLUDE_DROPZONE=1
  ; Functionality lost: database synchronization, mesh data consistency, distributed storage
  -DMESHTASTIC_EXCLUDE_REPLICATION=1
  ; Functionality lost: power consumption testing, battery stress analysis, power profiling
  -DMESHTASTIC_EXCLUDE_POWERSTRESS=1
  ; Functionality lost: GPS signal diagnostics, satellite info, positioning troubleshooting
  -DMESHTASTIC_EXCLUDE_GPS_DEBUG=1
  ; Functionality lost: ringtone playback, melody alerts, musical notifications
  ; -DMESHTASTIC_EXCLUDE_RTTTL=1        ; MINIMAL TEST: disabled (requires external file changes)
  ; Keep memory monitoring - needed for tracking RAM/Flash usage
  ; -DMESHTASTIC_EXCLUDE_MEMORY_MONITOR=1
  ; Keep NeighborInfo - CRITICAL for next hop routing, mesh topology discovery, and optimal path selection
  ; Functionality provided: nearby node discovery, neighbor listing, mesh topology view, routing intelligence
  ; -DMESHTASTIC_EXCLUDE_NEIGHBORINFO=1
  ; Functionality lost: automatic message replies, response handling, acknowledgment system
  -DMESHTASTIC_EXCLUDE_REPLY=1
  ; Keep XMODEM - needed for firmware updates via USB/serial
  ; -DMESHTASTIC_EXCLUDE_XMODEM=1
  ; Telemetry sensor exclusions - disable unnecessary sensor telemetry
  ; Functionality lost: battery level reporting, charge status, voltage monitoring, power metrics
  -DMESHTASTIC_EXCLUDE_HEALTH_TELEMETRY=1
  ; Functionality lost: PM2.5/PM10 readings, air pollution monitoring, environmental quality data
  -DMESHTASTIC_EXCLUDE_AIR_QUALITY_TELEMETRY=1
  ; Keep device telemetry - needed for system monitoring and health stats
  ; -DMESHTASTIC_EXCLUDE_DEVICE_TELEMETRY=1
  ; Keep POWER_TELEMETRY enabled - critical for battery voltage, charge level, power consumption monitoring
  ; Functionality lost: temperature/humidity/pressure environmental readings, weather data sharing
  -DMESHTASTIC_EXCLUDE_ENVIRONMENT_TELEMETRY=1
  ; Time synchronization exclusions - no internet/WiFi connectivity available
  ; Functionality lost: automatic clock synchronization, accurate timestamps, time zone handling
  -DMESHTASTIC_EXCLUDE_NTP=1
  ; Functionality lost: audible alerts, button click feedback, notification sounds
  -DHAS_BUZZER=0
  ; Build optimizations - minimize code size by excluding unused protobuf structures
  ; Functionality lost: some advanced message types, extended protocol features
  -DMESHTASTIC_MINIMAL_BUILD=1
  ; Compiler optimizations for maximum size reduction and performance
  -Os                                   ; Optimize for size over speed
  -ffunction-sections                   ; Place each function in separate section for better garbage collection
  -fdata-sections                       ; Place each data object in separate section for better garbage collection
  -Wl,--gc-sections                     ; Enable linker garbage collection of unused sections
  ; -flto                               ; LTO can cause issues, disable for now
  -fno-exceptions                       ; Disable C++ exceptions to save memory
  -fno-rtti                            ; Disable C++ runtime type information
  ; -DNDEBUG                          ; Keep debug for development
  ; -DNO_GLOBAL_INSTANCES             ; May break some modules
  ; -DMESHTASTIC_MINIMIZE_BUILD=1     ; Too aggressive, disable
  ; Additional memory optimizations
  ; PKI is enabled by default (not excluded) - critical for mesh security
  ; -DMESHTASTIC_EXCLUDE_ADMIN=1        ; Keep admin - needed for remote management
  ; -DMESHTASTIC_EXCLUDE_NODEINFO=1     ; Keep node info - needed for mesh topology
  -DHAS_LED=0                           ; Disable LED support
  -DHAS_BUTTON=0                        ; Disable button support
  -DMESHTASTIC_EXCLUDE_ROUTING_MODULE=0 ; Keep routing - essential for mesh
  -DMESHTASTIC_EXCLUDE_TEXT_MESSAGE=0   ; Keep text messages - core functionality
  ; -DPB_WITHOUT_64BIT=1                ; Keep 64-bit protobuf - may be needed for timestamps/IDs
  ; -DTINYGPS_OPTION_NO_STATISTICS=1    ; Would need library recompilation - skip for now
  ; -DMESHTASTIC_EXCLUDE_POSITION_MODULE=1 ; Keep position - needed for node location broadcast
  ; Additional optimizations for more memory savings
  -DMESHTASTIC_EXCLUDE_COMPRESSION=1    ; Disable text compression - saves ~4KB
  -DHAS_RTC=0                          ; Disable RTC support if not needed
  -DMESHTASTIC_EXCLUDE_JSON=1          ; Disable JSON API - saves ~3KB
  ; PKI security system - CRITICAL: keep enabled for mesh encryption, node authentication, secure communications
build_src_filter = ${nrf52_base.build_src_filter} +<../variants/rak4631_lite> +<mesh/api/> -<graphics/> -<input/> -<modules/Telemetry/Sensor/> +<modules/Telemetry/Sensor/TelemetrySensor.*> +<modules/Telemetry/Sensor/nullSensor.*> -<motion/> -<Fusion/> -<mesh/LLCC68Interface.cpp> -<mesh/LR11*Interface.cpp> -<mesh/SX1268Interface.cpp> -<mesh/SX1280Interface.cpp> -<mesh/SX128xInterface.cpp> -<mesh/STM32WLE5JCInterface.cpp> -<mesh/RF95Interface.cpp> -<mesh/api/WiFiServerAPI.cpp> -<mesh/api/ethServerAPI.cpp> -<Screen.cpp> -<modules/esp32/AudioModule.cpp> -<modules/ExternalNotificationModule.cpp> -<modules/DetectionSensorModule.cpp> -<modules/WaypointModule.cpp> -<modules/RangeTestModule.cpp> -<modules/CannedMessageModule.cpp> -<modules/AtakPluginModule.cpp> -<modules/StoreForwardModule.cpp> -<modules/RemoteHardwareModule.cpp> -<modules/DropzoneModule.cpp> -<modules/PowerStressModule.cpp> -<modules/ReplyModule.cpp> -<mesh/compression/> -<serialization/JSON.cpp> -<detect/einkScan.cpp>
lib_deps =
  ${nrf52840_base.lib_deps}
  melopero/Melopero RV3028@^1.1.0
  ; Minimal display library to satisfy includes (but functionality excluded via flags)
  thingpulse/ESP8266 and ESP32 OLED driver for SSD1306 displays@^4.6.0
  ; RTTTL library to satisfy includes (but functionality excluded via flags)
  end2endzone/NonBlockingRTTTL@^1.3.0
  ; Keep only necessary libraries for the build
lib_ignore =
  ; Exclude I2C sensors and unnecessary components
  Adafruit BMP280 Library
  Adafruit BMP085 Library
  Adafruit BME280 Library
  Adafruit DPS310
  Adafruit MCP9808 Library
  Adafruit INA260 Library
  Adafruit INA219
  Adafruit PM25 AQI Sensor
  Adafruit MPU6050
  Adafruit LIS3DH
  Adafruit AHTX0
  Adafruit LSM6DS
  Adafruit TSL2591 Library
  EmotiBit MLX90632
  Adafruit MLX90614 Library
  INA3221
  QMC5883LCompass
  DFRobot_RTU
  DFRobot_RainfallSensor
  INA226
  SparkFun MAX3010x Pulse and Proximity Sensor Library
  SparkFun 9DoF IMU Breakout - ICM 20948 - Arduino Library
  Adafruit LTR390 Library
  Adafruit PCT2075
  Adafruit BMP3XX Library
  Adafruit MAX1704X
  Adafruit SHTC3 Library
  Adafruit LPS2X
  Adafruit SHT31 Library
  Adafruit VEML7700 Library
  Adafruit SHT4x Library
  SparkFun Qwiic Scale NAU7802 Arduino Library
  ClosedCube OPT3001
  BME68x Sensor library
  bsec2
  DFRobot_LarkWeatherStation
  SoftwareSerial
  Adafruit NeoPixel
  ; Additional exclusions for memory savings
  WiFi
  BluetoothOTA
  Update
  WebServer
  ArduinoOTA
  AsyncTCP
  ESPAsyncWebServer
  WiFiClientSecure
  HTTPClient
  ; Exclude additional display libraries - not needed for headless build
  ThingPulse OLED SSD1306
  Adafruit SSD1306
  Adafruit GFX Library
  U8g2
  ; Exclude additional libraries for memory optimization
  TinyGPSPlus     ; GPS excluded - not needed when MESHTASTIC_EXCLUDE_GPS=1
  ; ArduinoThread ; KEEP - critical for threading system
  SimpleTimer
  ; Preferences   ; KEEP - may be needed for settings
  SPIFFS_ImageReader
  ArduinoJson
  StreamUtils
  ; Time          ; KEEP - may be needed for timestamps
  TaskScheduler
  LowPower
  ; Exclude sensor communication libraries
  OneWire
  DallasTemperature
  DHT_sensor_library
  DHT_sensor_library_for_ESPx
  ; Exclude additional networking
  PubSubClient
  AsyncMqttClient
  ESP32Ping
  ModbusMaster
  ; Exclude more unused libraries
  SD
  SD_MMC
  FS
  LittleFS
  EEPROM
  Ethernet
  WiFiUdp
  WiFiServer
  WebSocketsServer
  AsyncWebServer
  TFT_eSPI
  Adafruit_SSD1306
  Adafruit_ST7735
  FastLED


; Note: lib_src_filter doesn't work in PlatformIO, using build_flags instead
; If not set we will default to uploading over serial (first it forces bootloader entry by talking 1200bps to cdcacm)
; Note: as of 6/2013 the serial/bootloader based programming takes approximately 30 seconds
;upload_protocol = jlink

; Allows programming and debug via the RAK NanoDAP as the default debugger tool for the RAK4631 (it is only $10!)
; programming time is about the same as the bootloader version.
; For information on this see the meshtastic developers documentation for "Development on the NRF52"
[env:rak4631_eth_gw_dbg]
extends = env:rak4631
board_level = extra

; if the builtin version of openocd has a buggy version of semihosting, so use the external version
; platform_packages = platformio/tool-openocd@^3.1200.0

build_flags =
  ${env:rak4631_eth_gw.build_flags}
  -D USE_SEMIHOSTING

lib_deps =
  ${env:rak4631_eth_gw.lib_deps}
  https://github.com/geeksville/Armduino-Semihosting/archive/35b538fdf208c3530c1434cd099a08e486672ee4.zip

; NOTE: the pyocd support for semihosting is buggy.  So I switched to using the builtin platformio support for the stlink adapter which worked much better.
; However the built in openocd version in platformio has buggy support for TCP to semihosting.
;
; So I'm now trying the external openocd - but the openocd scripts for nrf52.cfg assume you are using a DAP adapter not an STLINK adapter.
; In theory I could change those scripts.  But for now I'm trying going back to a DAP adapter but with the external openocd.

upload_protocol = stlink
; eventually use platformio/tool-pyocd@^2.3600.0 instad
;upload_protocol = custom
;upload_command = pyocd flash -t nrf52840 $UPLOADERFLAGS $SOURCE
